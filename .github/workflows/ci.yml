name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Docs-only merges need no re-run; PRs always run so the checks stay required-safe.
    paths-ignore:
      - "**.md"
      - docs/**

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The checks run as parallel jobs; the slowest (server tests) sets the wall-clock time.
jobs:
  static:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  server:
    name: server + shared tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rsc
          POSTGRES_PASSWORD: rsc
          POSTGRES_DB: rsc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rsc:rsc@localhost:5432/rsc
      TEST_DATABASE_URL: postgres://rsc:rsc@localhost:5432/rsc_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations match the schema
        run: |
          pnpm --filter @rsc/server db:check
          pnpm db:generate
          git status --porcelain apps/server/drizzle
          test -z "$(git status --porcelain apps/server/drizzle)" || {
            echo "::error::Schema changed without a migration. Run pnpm db:generate and commit it."
            exit 1
          }
      - name: Migrations apply to a clean database, seed runs
        run: |
          pnpm db:migrate
          pnpm db:seed
      - run: pnpm --filter @rsc/shared --filter @rsc/server test

  mobile:
    name: app tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Jest is CPU-bound on the 2-core runner (about 5 min in one piece), so split it.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: /tmp/jest-cache
          key: jest-${{ hashFiles('pnpm-lock.yaml') }}-${{ matrix.shard }}
          restore-keys: jest-
      - run: pnpm --filter @rsc/mobile exec jest --ci --cacheDirectory=/tmp/jest-cache --shard=${{ matrix.shard }}/3

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
