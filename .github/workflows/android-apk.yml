name: Android APK

# Builds an installable APK without any Expo/EAS or store account, in one of two variants
# (docs/adr/0020-build-variants.md):
#   tester      "SFF RSC Teste", wired to staging, with the tester tools. Built on every merge that
#               touches native inputs; published as the rolling pre-release `android-latest`.
#   production  "SFF RSC", wired to the prod server only. Built by hand (Run workflow, variant
#               production); published as the pre-release `android-prod`.
# Runbook: docs/OPERATIONS.md#android-apks

on:
  push:
    branches: [main]
    # Only native inputs: JS-only changes reach installed apps over the air
    # (docs/OPERATIONS.md#over-the-air-updates). Run by hand after bumping runtimeVersion.
    paths:
      - apps/mobile/package.json
      - apps/mobile/app.json
      - apps/mobile/app.config.js
      - pnpm-lock.yaml
      - scripts/android-signing.py
      - .github/workflows/android-apk.yml
  workflow_dispatch:
    inputs:
      variant:
        description: Which app to build
        type: choice
        options: [tester, production]
        default: tester

concurrency:
  group: android-apk-${{ inputs.variant || 'tester' }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_VARIANT: ${{ inputs.variant || 'tester' }}
  EXPO_PUBLIC_APP_VARIANT: ${{ inputs.variant || 'tester' }}
  # The server this variant talks to: staging for the tester app, prod for the production app.
  # Only the variant being built ever sees its own address.
  EXPO_PUBLIC_API_URL: ${{ inputs.variant == 'production' && (vars.PROD_API_URL || (vars.PROD_DOMAIN && format('https://{0}', vars.PROD_DOMAIN)) || format('https://prod.{0}', vars.DEPLOY_HOST)) || vars.APK_API_URL || 'https://178-105-48-29.sslip.io' }}
  RELEASE_TAG: ${{ inputs.variant == 'production' && 'android-prod' || 'android-latest' }}
  APP_LABEL: ${{ inputs.variant == 'production' && 'SFF RSC (production)' || 'SFF RSC Teste (tester)' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: pnpm install --frozen-lockfile

      - name: Prebuild native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Give Gradle and KSP enough memory
        # expo-updates' KSP step died with "OutOfMemoryError: Metaspace" and the build then hung
        # until the job timeout (no APK, no release). The default JVM limits are too small.
        run: |
          props=apps/mobile/android/gradle.properties
          sed -i '/^org.gradle.jvmargs=/d;/^kotlin.daemon.jvm.options=/d' "$props"
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError"
            echo "kotlin.daemon.jvm.options=-Xmx2g -XX:MaxMetaspaceSize=1g"
          } >> "$props"

      - name: Versioning and signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle=apps/mobile/android/app/build.gradle
          # Android only installs an APK over an older one if versionCode grows.
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" "$gradle"
          grep -q "versionCode ${{ github.run_number }}" "$gradle"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          fi
          python3 scripts/android-signing.py "$gradle"

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --build-cache --parallel -PreactNativeArchitectures=arm64-v8a

      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "rsc-companion-${APP_VARIANT}.apk"
          short="${GITHUB_SHA::7}"
          notes="$APP_LABEL build ${{ github.run_number }} from \`$short\` (versionCode ${{ github.run_number }}), built $(date -u +%Y-%m-%d\ %H:%M) UTC. Talks to $EXPO_PUBLIC_API_URL. Not a store release. Install over the previous one of the same app; Android only accepts a higher build number."
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"
          # Recreate the release each time: editing keeps the original date, so the
          # releases page would show a stale build.
          gh release delete "$RELEASE_TAG" --yes 2>/dev/null || true
          gh release create "$RELEASE_TAG" "rsc-companion-${APP_VARIANT}.apk" --prerelease \
            --title "$APP_LABEL Android build ${{ github.run_number }} ($short)" --notes "$notes"
