name: Ops

# Server tasks over SSH (deploy/ci.sh, docs/OPERATIONS.md). Run by hand from the Actions tab
# (Run workflow, pick a task); image.yml calls it with "deploy" after each push to main.

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do on the server
        type: choice
        options: [deploy, status, backup, restore-drill, setup, seed-demo, reset-demo, create-admin, grant-developer, demo-code, rotate-demo-code, registration-key, rotate-registration-key, export-feedback, check-storage, prune, disk-report, disk-check]
        default: deploy
      stack:
        description: Which stack (prod is a manual release and needs an image tag)
        type: choice
        options: [staging, prod]
        default: staging
      admin_email:
        description: "create-admin: the new admin's email (gets a link to choose a password). grant-developer: the login to make developer. demo-code / rotate-demo-code: where to email the tester access code"
        type: string
        default: ""
      admin_name:
        description: "create-admin only: the new admin's name"
        type: string
        default: ""
      image:
        description: "Prod only: image tag to release, for example sha-1a2b3c4 (published by the Image workflow)"
        type: string
        default: ""
  workflow_call:
    inputs:
      task:
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - run: deploy/ci.sh "$TASK"
        env:
          TASK: ${{ inputs.task }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          ADMIN_NAME: ${{ inputs.admin_name }}
          STACK: ${{ inputs.stack || 'staging' }}
          PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
          PROD_SELF_REGISTRATION: ${{ vars.PROD_SELF_REGISTRATION }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ inputs.stack == 'prod' && format('ghcr.io/{0}/rsc-companion:{1}', github.repository_owner, inputs.image) || vars.APP_IMAGE }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_LOGIN: ${{ secrets.SMTP_LOGIN }}
          SMTP_KEY: ${{ secrets.SMTP_KEY }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          STORAGE_S3_ENDPOINT: ${{ vars.STORAGE_S3_ENDPOINT }}
          STORAGE_S3_REGION: ${{ vars.STORAGE_S3_REGION }}
          STORAGE_S3_BUCKET: ${{ vars.STORAGE_S3_BUCKET }}
          STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.STORAGE_S3_ACCESS_KEY_ID }}
          STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_S3_SECRET_ACCESS_KEY }}
          DISK_ALERT_EMAIL: ${{ vars.DISK_ALERT_EMAIL }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          PROD_STORAGE_S3_ENDPOINT: ${{ vars.PROD_STORAGE_S3_ENDPOINT }}
          PROD_STORAGE_S3_REGION: ${{ vars.PROD_STORAGE_S3_REGION }}
          PROD_STORAGE_S3_BUCKET: ${{ vars.PROD_STORAGE_S3_BUCKET }}
          PROD_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.PROD_STORAGE_S3_ACCESS_KEY_ID }}
          PROD_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.PROD_STORAGE_S3_SECRET_ACCESS_KEY }}
