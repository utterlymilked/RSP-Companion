# Local development services. Start with: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rsc
      POSTGRES_PASSWORD: rsc
      POSTGRES_DB: rsc
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
