# One stack on the server (docs/OPERATIONS.md, ADR 0017): the app image, Postgres and, in the
# staging stack only (COMPOSE_PROFILES=edge), the Caddy that serves staging and prod.
# Staging lives in /opt/rsc, prod in /opt/rsc/prod (COMPOSE_PROJECT_NAME=rscprod), each next to
# its own .env.
#   docker compose pull && docker compose up -d
name: ${COMPOSE_PROJECT_NAME:-rsc}

# Container logs rotate so they cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/utterlymilked/rsc-companion:main}
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_URL: ${APP_URL}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_ACCESS_CODE: ${DEMO_ACCESS_CODE:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SMTP_URL: ${SMTP_URL}
      MAIL_FROM: ${MAIL_FROM}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
    networks:
      default:
      edge:
        aliases: ["${STACK:-staging}-app"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    profiles: [edge]
    networks: [default, edge]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      PROD_DOMAIN: ${PROD_DOMAIN:-prod.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

networks:
  edge:
    external: true
    name: rsc-edge

volumes:
  db-data:
  caddy-data:
  caddy-config:
